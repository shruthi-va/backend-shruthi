server:
  port: 8081

spring:
  application:
    name: policy-service
  datasource:
    url: jdbc:h2:mem:policydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/claims

springdoc:
  swagger-ui:
    oauth:
      client-id: claims-swagger

policy:
  outbox:
    relay-interval-ms: 500
