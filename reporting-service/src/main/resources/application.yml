server:
  port: 8084

spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:h2:mem:reportingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reporting-service
      enable-auto-commit: false
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/claims

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    oauth:
      client-id: claims-swagger
